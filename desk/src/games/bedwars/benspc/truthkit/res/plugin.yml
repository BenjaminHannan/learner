name: GlimTruthKit
version: 1.0
main: glim.tk.TruthKit
depend: [BedWars1058]
description: Glim's Bedwars truth log (ms times, hits, crits, deaths, edges, per-tick positions) + auto-join + match start/stop (copy of PlayKit, extended)
commands:
  tk:
    description: GlimTruthKit admin (console, RCON or op)
    usage: /tk status | autojoin <arena|off> | join <player> <arena> | start <arena> | stop <arena|all> | nudge <player> vx vy vz | truth on|off
