<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; script-src 'self'">
<title>Browser</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div id="bar">
  <button id="back" class="ib" aria-label="Back" title="Back"><svg viewBox="0 0 16 16"><path d="M13 8H3M7 4L3 8l4 4"/></svg></button>
  <button id="fwd" class="ib" aria-label="Forward" title="Forward"><svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
  <button id="reload" class="ib" aria-label="Reload" title="Reload"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 11-1.6-3.7M13 2.5V5.5H10"/></svg></button>
  <input id="addr" type="text" placeholder="Search or enter address" spellcheck="false" aria-label="Address">
  <span id="who" class="who"><i></i><span>You're in control</span></span>
  <button id="handback" class="primary" title="Close this window and let Glim carry on">Hand back to Glim</button>
  <button id="close" class="ib" aria-label="Close" title="Close (Glim keeps working)"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
</div>
<div id="banner" hidden role="status">
  <svg viewBox="0 0 16 16" class="lock"><rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>
  <span id="bannerText">Sign in here yourself; Glim can't see what you type. Click Done when finished.</span>
  <button id="done" class="primary">Done</button>
  <button id="skip" class="plain">Not now</button>
</div>
<script src="popup.js"></script>
</body>
</html>
