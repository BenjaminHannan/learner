<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
<title>Glim status</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="mascot.css">
<link rel="stylesheet" href="pill.css">
</head>
<body>
<div id="pill" class="gone" role="status" aria-live="polite">
  <div class="row1"><span id="g"></span><span id="line"></span><span id="mini"></span></div>
  <div class="more">
    <div class="kv"><span>Agent</span><b id="dName"></b></div>
    <div class="kv"><span>Doing</span><b id="dStep"></b></div>
    <div class="kv"><span>Time</span><b id="dTime"></b></div>
    <div id="dErr" class="err sel" hidden></div>
    <div id="dAsk" class="ask sel" hidden></div>
    <div id="dOthers" class="others"></div>
    <div id="btns" class="btns"></div>
  </div>
</div>
<script src="mascot.js"></script>
<script src="pill.js"></script>
</body>
</html>
