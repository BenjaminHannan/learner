<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; script-src 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premonition Desk</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="mascot.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="topbar">
  <span id="logo" class="logo" title="Glim"></span>
  <button id="btnThreads" class="icon-btn" title="Threads" aria-label="Threads">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h7"/></svg>
  </button>
  <div id="title" title="Rename thread" role="button" tabindex="0">New thread</div>
  <div class="spacer"></div>
  <div class="seg" id="modelSeg" role="group" aria-label="Model">
    <button data-model="qwen36-auto">Auto</button><button data-model="qwen36">Think</button><button data-model="qwen36-fast">Fast</button>
  </div>
  <div class="seg mode" id="modeSeg" role="group" aria-label="Autonomy">
    <button data-mode="ask">Ask first</button><button data-mode="hands-off">Hands-off</button>
  </div>
  <div id="gw" class="chip" title="Gateway"><i></i><span>Offline</span></div>
  <button id="btnSettings" class="icon-btn" title="Settings (Cmd+,)" aria-label="Settings">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
  </button>
</header>

<main id="chat">
  <aside id="drawer" aria-hidden="true">
    <div class="drawer-head"><span>Threads</span><button id="newThread" class="amber-btn sm">+ New</button></div>
    <div id="agentsSec" hidden><div class="drawer-label">Agents</div><ul id="agentList"></ul></div>
    <div class="drawer-label">Threads</div>
    <ul id="threadList"></ul>
  </aside>
  <div id="drawerShade"></div>
  <div id="scroll"><div id="msgs"></div></div>
  <div id="composer">
    <div class="cwrap">
      <div id="pwWarn" hidden role="alert">
        <span>Don't paste passwords here; I'll open a sign-in window instead.</span>
        <button id="pwSend" class="ghost sm">Send anyway</button><button id="pwCancel" class="amber-btn sm">Cancel</button>
      </div>
      <div id="runState" hidden><i></i><span>Working…</span></div>
      <div class="box">
        <textarea id="input" rows="1" placeholder="Ask Glim to do something…" spellcheck="true" aria-label="Message"></textarea>
        <button id="btnSend" class="send" title="Send (Enter)">Send</button>
        <button id="btnStop" class="stop" title="Stop (Esc)" hidden><span></span>Stop</button>
      </div>
      <div class="hint" id="hint">Enter to send · Shift+Enter for a new line</div>
    </div>
  </div>
</main>

<div id="settings" hidden role="dialog" aria-label="Settings">
  <div class="s-head"><h1>Settings</h1><button id="settingsClose" class="amber-btn">Done</button></div>
  <div class="s-body"><div class="s-col" id="settingsCol"></div></div>
</div>

<div id="screenModal" hidden role="dialog" aria-label="Screen capture">
  <div class="in"><div class="sm-head"><span>What Glim saw</span><button id="screenClose" class="ghost sm">Close</button></div><img id="screenImg" alt="Latest screen capture"><pre id="screenText" class="sel"></pre></div>
</div>

<script src="mascot.js"></script>
<script src="md.js"></script>
<script src="guard.js"></script>
<script src="app.js"></script>
</body>
</html>
